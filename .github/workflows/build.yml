name: Build OmniNote APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Move Flat Uploaded Files Into Android Folders Automatically
        run: |
          mkdir -p app/src/main/java/com/omninote/study
          for f in NoteModels.kt StorageAndPdfManager.kt GeometryHelper.kt MainActivity.kt; do
            if [ -f "$f" ]; then mv "$f" app/src/main/java/com/omninote/study/; fi
          done
          if [ -f "AndroidManifest.xml" ]; then mv "AndroidManifest.xml" app/src/main/; fi

      - name: Ensure Root and App Gradle Files Match
        run: |
          if grep -q "com.omninote.study" build.gradle.kts; then
            cp build.gradle.kts app/build.gradle.kts
            printf 'plugins {\n    id("com.android.application") version "8.4.1" apply false\n    id("org.jetbrains.kotlin.android") version "1.9.24" apply false\n}\n' > build.gradle.kts
          fi

      - name: Generate Fixed Debug Keystore for Seamless APK Updates
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniNote-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
